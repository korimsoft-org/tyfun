name: Deploy to the NPM repo

# Releases every push to main (in practice: every merged pull request).
#
# Direct pushes to main are forbidden, so the version bump is never committed back.
# The released version lives in the git tags (vX.Y.Z) and on npm; the version in
# package.json on main is only a fallback for the very first run without tags.
#
# The bump comes from the labels of the merged pull request:
#   release:major -> major, release:minor -> minor, otherwise -> patch.

on:
  push:
    branches:
      - main

# One release at a time, so two quick merges never compute the same version.
# A run waiting here is replaced by a newer one; the newer release contains its changes.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write       # push the release tag
  pull-requests: read   # read the labels of the merged pull request
  id-token: write       # npm provenance / trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    environment: publish-npm
    strategy:
      matrix:
        node-version: [ 26.x ]
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Show Node and pnpm versions
        run: |
          node --version
          pnpm --version

      - name: Work out the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of a commit that is already tagged releases that same version again.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$existing" ]; then
            version="${existing#v}"
            echo "Commit is already tagged $existing, reusing it"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            base="${latest#v}"
            [ -n "$base" ] || base=$(node -p "require('./package.json').version")

            labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[].labels[].name] | join(",")')
            case ",$labels," in
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
              *)                 bump=patch ;;
            esac

            version=$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] };
              console.log(next[process.argv[2]].join("."));
            ' "$base" "$bump")
            echo "Latest release: ${latest:-none (package.json $base)}, labels: ${labels:-none}, bump: $bump"
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set the version in package.json (not committed)
        run: npm pkg set version='${{ steps.version.outputs.version }}'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - run: pnpm test

      # Tag before publishing: if the publish fails, a rerun finds the tag and retries the same version.
      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # --no-git-checks: package.json is changed and HEAD is detached, both on purpose
      - name: Publish the artifact to NPM registry
        run: pnpm publish --provenance --no-git-checks
